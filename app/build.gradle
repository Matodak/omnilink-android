plugins {
    id 'com.android.application'
}

android {
    namespace "net.homeip.mleclerc.omnilinkanclient"
    compileSdk 36

    defaultConfig {
        applicationId "net.homeip.mleclerc.omnilinkanclient"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation files('libs/ksoap2-android-assembly-2.6.5-jar-with-dependencies.jar')
    implementation files('libs/omnilink.jar')
}
